services:
  zy-stats:
    build:
      context: .
      pull: true
    container_name: zy-stats
    environment:
      - FORCE_COLOR=1
    volumes:
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # restart: unless-stopped
